name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare Debug Keystore & Environment
      run: |
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f ".env" ]; then
          cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
        fi

    - name: Run Unit Tests
      run: gradle testDebugUnitTest

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Fixa APK
      uses: actions/upload-artifact@v4
      with:
        name: Fixa-AI-Assistant-APK
        path: app/build/outputs/apk/debug/*.apk
